<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 428px;
      height: 926px;
      background: #FFF3EA;
      overflow: hidden;
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    }

    .container {
      width: 428px;
      height: 926px;
      position: relative;
      overflow: hidden;
    }

    /* ── TITLE ── */
    .title-section {
      padding: 58px 28px 0;
      text-align: center;
    }

    .line1 {
      font-size: 40px;
      font-weight: 900;
      color: #E87200;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .line2 {
      font-size: 40px;
      font-weight: 900;
      color: #2D1800;
      line-height: 1.1;
      letter-spacing: -0.5px;
      margin-top: 2px;
    }

    /* ── APP CARD ── */
    .card {
      position: absolute;
      top: 210px;
      left: 22px;
      right: 22px;
      bottom: 72px;
      background: #FFFFFF;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(100, 40, 0, 0.13);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    /* ── BOTTOM ORANGE BLOCKS ── */
    .block-left {
      position: absolute;
      bottom: 0;
      left: 22px;
      width: 130px;
      height: 68px;
      background: #FF8C00;
      border-radius: 18px 18px 0 0;
    }

    .block-right {
      position: absolute;
      bottom: 0;
      right: 22px;
      width: 88px;
      height: 48px;
      background: #FF8C00;
      border-radius: 14px 14px 0 0;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="title-section">
      <div class="line1">Toutes tes recettes</div>
      <div class="line2">au même endroit</div>
    </div>

    <div class="card">
      <img src="./originals/screen1.png" alt="">
    </div>

    <div class="block-left"></div>
    <div class="block-right"></div>

  </div>
</body>
</html>
